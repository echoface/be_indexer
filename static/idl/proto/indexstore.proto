syntax = "proto3";
package indexstore;
option go_package = "./indexstore";

// ------------------------------------------------------------------
// Metadata Section
// ------------------------------------------------------------------

message FieldDesc {
    string name = 1;
    uint64 id = 2;
    string container = 3; // "default", "ac", "range", etc.
    string parser = 4;    // e.g. "identity", "number", "str_hash"
}

message IndexMetadata {
    int32 version = 1;
    string indexer_type = 2; // "kgroups" or "compact"
    map<string, FieldDesc> fields = 3;
    map<string, uint64> id_allocator = 4; // string key -> internal ID
}

// ------------------------------------------------------------------
// Common Data Types
// ------------------------------------------------------------------

message EntryIDList {
    repeated uint64 ids = 1;
}

message TermPostingEntry {
    uint64 field = 1;
    oneof field_value {
        uint64 u64_val = 2;
        string str_val = 3;
    };
    EntryIDList ids = 4;
}

// CompressedFlatMap: Stores compressed(flat) map representation for (field_id, str_key) -> posting list.
// It avoids expanding posting lists into explicit ids during Dump/Load.
message FlatMapKey {
    uint64 field_id = 1;
    string str_key = 2;
    // Header offset (start index) in the Headers array.
    uint32 header_offset = 3;
    // Total length of the posting list.
    uint32 length = 4;
}

message FlatMapHeader {
    uint64 last_entry_id = 1;
    uint32 offset = 2;
}

message CompressedFlatMap {
    // Block size used when compressing posting lists.
    uint32 block_size = 1;
    repeated FlatMapKey keys = 2;
    repeated FlatMapHeader headers = 3;
    bytes data = 4;
}

// ACEntriesHolder: Stores keyword -> entries mapping
message ACEntry {
    string keyword = 1;
    EntryIDList ids = 2;
}

message ACHolderDump {
    repeated ACEntry entries = 1;
}

// RangeHolder / OptimizedRangeHolder: Stores precise matches + range definitions
message RangeEntry {
    int64 left = 1;
    int64 right = 2;
    // uint64 entry_id = 3; // Deprecated
    bytes bitmap = 4; // Serialized RoaringBitmap
    repeated uint64 ids = 5; // Fallback list
}

// CompressedInt64FlatMap: Stores compressed(flat) map representation for int64 -> posting list.
// Used by OptimizedRangeHolder for EQ postings.
message Int64FlatMapKey {
    int64 key = 1;
    // Header offset (start index) in the Headers array.
    uint32 header_offset = 2;
    // Total length of the posting list.
    uint32 length = 3;
}

message CompressedInt64FlatMap {
    // Block size used when compressing posting lists.
    uint32 block_size = 1;
    repeated Int64FlatMapKey keys = 2;
    repeated FlatMapHeader headers = 3;
    bytes data = 4;
}

message RangeHolderDump {
    // Precise matches (e.g. age = 18)
    CompressedInt64FlatMap eq_flat = 1;
    // Range definitions (e.g. age in [10, 20])
    repeated RangeEntry ranges = 2;
}

// ------------------------------------------------------------------
// Phase 2: Term Dictionary & Segment Data
// ------------------------------------------------------------------

message TermDict {
    // 简单的 Block 存储：所有字符串拼接在一起
    bytes content = 1;
    // 偏移量列表
    repeated uint32 offsets = 2;
    // FST 数据 (预留)
    bytes fst_data = 3; 
}

message PostingPtr {
    // uint64 term_id = 1; // 隐式使用数组下标
    uint32 header_offset = 2; // 指向 PostingData 的 Header 索引
    uint32 length = 3; // 包含的文档数量
}

message SegmentData {
    // 1. Term Dictionary
    TermDict dict = 1;
    
    // 2. Postings (Index 是 TermID)
    repeated PostingPtr postings = 2; 
    
    // 3. Compressed Posting Data (实际的倒排数据块)
    // 包含 Headers 和 Data
    // 注意：这里复用 FlatMapHeader 的概念，但不使用 CompressedFlatMap 结构
    repeated FlatMapHeader headers = 3;
    bytes posting_data = 4;
    
    // Block size used
    uint32 block_size = 5;
}

// Represents a single field's serialized data
message HolderDump {
    string field_name = 1;
    string holder_type = 2;
    bytes content = 3; // Serialized protobuf of specific holder (e.g. DefaultHolderDump)
    int32 group_id = 4; // For K-Groups: which container it belongs to
}

// Represents the whole index dump (if small enough to be loaded at once)
// For large indexes, we recommend streaming: Metadata -> Wildcards -> Repeated HolderDump
message IndexDump {
    IndexMetadata metadata = 1;
    EntryIDList wildcards = 2;
    repeated HolderDump holders = 3;
}
